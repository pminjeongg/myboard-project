<!DOCTYPE html>
<!-- 문서 타입을 HTML5로 선언 -->
<html>
<head>
<meta charset="UTF-8"> <!-- 문자 인코딩을 UTF-8로 설정 (한글 깨짐 방지) -->
<title>테트리스</title> <!-- 브라우저 탭에 표시될 제목 -->
<style>
    /* 표(table) 관련 스타일 */
    table{
        border-collapse:collapse; /* 셀 사이 이중 테두리를 하나로 합침 */
    }
    td{
        width:80px;        /* 각 칸(셀)의 가로 크기 */
        height:80px;       /* 각 칸(셀)의 세로 크기 */
        border:1px solid gray; /* 칸 테두리 색과 두께 */
        text-align:center; /* 칸 안 텍스트 가운데 정렬 */
    }
    body{
        position:relative; /* 자식 요소 중 position:absolute 기준점 역할 */
    }
    #header{
        display:flex;        /* 제목과 점수를 가로로 나란히 배치 */
        align-items:center;  /* 세로 중앙 정렬 */
        gap:20px;             /* 요소 사이 간격 */
    }
    #nextArea{
        position:absolute; /* body 기준으로 위치를 고정 */
        top:20px;          /* 위에서 20px 떨어진 위치 */
        right:20px;        /* 오른쪽에서 20px 떨어진 위치 */
        display:flex;       /* 레벨 표시와 다음 블록 미리보기를 가로 배치 */
        align-items:center;
        gap:10px;
    }
    #nextBox{
        width:60px;   /* 다음 블록 색을 보여줄 박스 크기 */
        height:60px;
        border:2px solid black; /* 박스 테두리 */
        margin:0 auto;           /* 가운데 정렬 */
    }
    #levelDisplay{
        color:red;        /* 레벨 숫자를 빨간색으로 강조 */
        font-weight:bold; /* 굵게 표시 */
        font-size:20px;
    }
</style>
<script>
// ===== 전역 변수 선언 =====
let cell = [];            // (10x10)를 저장할 배열
let board = [];           // board[행][열] 형태의 2차원 배열, 각 칸의 색상 상태("" 또는 색 이름) 저장
let currentBlockRow = 0;  // 현재 떨어지고 있는 블록의 행(row) 위치
let currentBlockCols;     // 현재 떨어지고 있는 블록의 열(column) 위치
let currentColor;         // 현재 떨어지고 있는 블록의 색상
let timerID;              // 타이머
let score = 0;            // 현재 점수
let nextColor;            // 다음 색 미리보기
let color = ["red","blue","green","yellow","purple","orange"]; // 블록에 색상

let level = 0;          // 현재 레벨
let intervalStep = 40;  // 레벨이 오를 때마다 빠르게 떨어지게 하는 스탭

//랜덤하게 색 뽑기
function randomColor(){
    // color의 길이만큼 랜덤하게 뽑기
    return color[Math.floor(Math.random()*color.length)];
}

//게임판(테이블) 만들기
function createTable(){
    let parent = document.getElementById("tablearea"); // 표를 넣을 부모 div 가져오기
    let table = document.createElement("table");        // <table> 요소 새로 생성
    parent.appendChild(table);                           // 화면에 table 추가
    let k = 0; // cell 배열에 넣을 때 사용할 순번(0~99)
    for(let i=0;i<10;i++){         // 행(row) 10개 반복
        board[i]=[];               // board의 i번째 행을 배열로 초기화
        let tr=document.createElement("tr"); // <tr>(행) 요소 생성
        table.appendChild(tr);               // table에 행 추가
        for(let j=0;j<10;j++){     // 열(column) 10개 반복
            board[i][j]="";          // 처음엔 빈 칸("")으로 설정
            let td=document.createElement("td"); // <td>(칸) 요소 생성
            tr.appendChild(td);                   // 행에 칸 추가
            cell[k]=td;                            // cell 배열에 이 칸을 저장 (나중에 색칠할 때 사용)
            k++;                                    // 다음 순번으로 증가
        }
    }
    nextColor=randomColor(); // 첫 번째로 미리 보여줄 "다음 색"을 랜덤하게 정해둠
    draw();                   // 첫 블록을 화면에 그림
    timerID=setInterval(moveDown,500); // 0.5초마다 moveDown 함수를 자동 실행 (블록 자동 하강)
    document.addEventListener("keydown",keyDown); // 키보드 입력 감지 이벤트 등록
    document.getElementById("levelDisplay").textContent=level; // 화면에 레벨 0 표시
}

//새 블록 만들기(생성)
function draw(){
    currentBlockRow=0; // 새 블록은 항상 맨 위(0행)에서 시작
    currentBlockCols=Math.floor(Math.random()*10); // 0~9 중 랜덤한 열 위치 선택
    if(board[currentBlockRow][currentBlockCols]!=""){
        // 블록이 생성될 지리에 이미 다른 블록이 쌓여있다면 게임끝
        clearInterval(timerID); // 자동 하강 타이머부터 즉시 정지
        let again = confirm("게임 오버! 최종 점수 : " + score + "\n게임을 다시 시작하시겠습니까?"); // 다시시작할지 여부
        if(again){
            restartGame(); // 예를 누르면 게임 초기화 후 재시작
        }
        // "아니오"면 타이머가 이미 멈췄기 때문에 게임끝
        return;
    }
    currentColor=nextColor; // 위 박스에서 보여준 그 다음 색을 이번 블록의 색으로 확정
    cell[currentBlockRow*10+currentBlockCols].style.backgroundColor=currentColor; // 해당 칸에 색칠
    nextColor=randomColor(); // 그 다음에 나올 색을 새로 랜덤하게 뽑아둠
    document.getElementById("nextBox").style.backgroundColor=nextColor; // 미리보기 박스에 뜨깅
}

//게임 재시작
function restartGame(){
    clearInterval(timerID); // 이미 돌고 있던 타이머 멈추기
    score = 0;   // 점수 초기화
    level = 0;   // 레벨 초기화
    document.getElementById("score").textContent = score;        // 점수 초기화
    document.getElementById("levelDisplay").textContent = level; // 레벨 초기화
    for(let i=0;i<10;i++){        // 보드 전체 쭉 돌면서
        for(let j=0;j<10;j++){
            board[i][j] = "";     // 모든 보드칸을 다 초기화시티기
            cell[i*10+j].style.backgroundColor = ""; // 나와있는 색도 모두 삭제
        }
    }
    timerID = setInterval(moveDown,500); // 500ms간격으로 movedown부르기
    draw(); // 새 블록 다시 생성
}

// 블록을 한 칸 아래로 이동
function moveDown(){
    if(currentBlockRow==9 || board[currentBlockRow+1][currentBlockCols]!=""){
        // 9번째 행이거나 아래 칸에 이미 다른 블록이 있다면ㄴ
        landPiece(); // 더 이상 내려갈 수 없으므로 착지하는 함수 부름
        return;     
    }
    cell[currentBlockRow*10+currentBlockCols].style.backgroundColor=""; // 현재 위치의 색을 지우고
    currentBlockRow++; // 한 칸 아래로 행 번호 증가
    cell[currentBlockRow*10+currentBlockCols].style.backgroundColor=currentColor; // 새 위치에 색 넣기
}

// 블록이 바닥/다른 블록 위에 착지했을 때 
function landPiece(){
    board[currentBlockRow][currentBlockCols]=currentColor; // 현재 블록의 색을 board 데이터에 확정 반영
    while(clearMatches()){ // 3개 이상 연속이있는 동안 계속 반복
        applyGravity();     // 매치로 지워진 칸을 채우기 위해 중력함수부르기
    }
    draw(); // 다음 새 블록을 생성
}

// 가로/세로/대각선으로 3개 이상 같은 색이 연속되면 제거하는 함수
function clearMatches(){
    let blocksToremove=[]; // 없으면 오류가 나서 미리 저장하는 배열 만듦
    for(let i=0;i<10;i++){
        blocksToremove[i]=[];
        for(let j=0;j<10;j++){
            blocksToremove[i][j]=false; // 모든 칸을 false로 초기화
        }
    }

    //가로 검사 ----
    for(let r=0;r<10;r++){        // 각 행마다 검사
        let count=1;                // 같은 색이 나온 개수 (자기 자신부터 1로 시작)
        for(let c=1;c<10;c++){     // 왼쪽에서 오른쪽으로 열(c) 검사
            if(board[r][c]!="" && board[r][c]==board[r][c-1]){
                count++; // 바로 왼쪽 칸과 색이 같으면 연속 개수 증가
            }
            else{
                if(count>=3){ // 연속이 끊기는 시점에 개수가 3 이상이었다면
                    for(let k=1;k<=count;k++){
                        blocksToremove[r][c-k]=true; // 그 연속된 칸들을 전부 true로 표시
                    }
                }
                count=1; // 연속 개수 다시 1로 바꾸기
            }
        }
        if(count>=3){ // 행의 마지막까지 검사한다음 끝에서 연속되어 끝난 경우에도 체크
            for(let k=1;k<=count;k++){
                blocksToremove[r][10-k]=true;
            }
        }
    }

    //세로검사
    for(let c=0;c<10;c++){
        let count=1;
        for(let r=1;r<10;r++){
            if(board[r][c]!="" && board[r][c]==board[r-1][c]){
                count++;
            }
            else{
                if(count>=3){
                    for(let k=1;k<=count;k++){
                        blocksToremove[r-k][c]=true;
                    }
                }
                count=1;
            }
        }
        if(count>=3){
            for(let k=1;k<=count;k++){
                blocksToremove[10-k][c]=true;
            }
        }
    }

    //대각선 검사
    for(let r=0;r<=7;r++){       // r+2가 9를 넘으면 안돼서 7까지
        for(let c=0;c<=7;c++){   // c+2가 9를 넘으면 안돼서 7까지
            if(board[r][c]=="")
                continue; // 빈 칸이면 다음으로 넘어감
            if(board[r][c]==board[r+1][c+1] &&
               board[r][c]==board[r+2][c+2]){
                // (r,c), (r+1,c+1), (r+2,c+2) 이 칸들이 모두 같은 색이면 매치
                blocksToremove[r][c]=true;
                blocksToremove[r+1][c+1]=true;
                blocksToremove[r+2][c+2]=true; //true로 바꾸기
            }
        }
    }

    //대각선 검사
    for(let r=0;r<=7;r++){
        for(let c=2;c<10;c++){   // c-2가 0보다 작음안돼서 2부터 시작
            if(board[r][c]=="")
                continue;
            if(board[r][c]==board[r+1][c-1] &&
               board[r][c]==board[r+2][c-2]){
                blocksToremove[r][c]=true;
                blocksToremove[r+1][c-1]=true;
                blocksToremove[r+2][c-2]=true;
            }
        }
    }

    //true들을 지우고 점수에 반영하기
    let found=false; 
    for(let r=0;r<10;r++){
        for(let c=0;c<10;c++){
            if(blocksToremove[r][c]){
                found=true;                       // 지운 칸이 있었음을 표시
                board[r][c]="";                    // 데이터 상 해당 칸을 빈 칸으로
                cell[r*10+c].style.backgroundColor=""; // 화면 상 색상 지우기
                score+=100;                         // 칸 하나 지울 때마다 점수 100점씩 추갛기
                document.getElementById("score").textContent=score; // 화면 점수 갱신
            }
        }
    }
    if(found){
        updateSpeed(); // 매치가 발생했했으면 점수가 바뀌는거에 따라서 속도 바꾸기
            }
    return found; //매치가잇었는지없었는지
}

//점수에 따라 속도를 조절하는 함수 
function updateSpeed(){
    let newLevel=Math.min(Math.floor(score/1000),10);
    // 점수 1000점당 레벨 1씩 증가, 단 최대 레벨은 10으로 제한
    if(newLevel!=level){ // 레벨이 실제로 바뀌었을 때만 처리 (매번 타이머 재설정하는 낭비 방지)
        level=newLevel;               // 레벨 값 갱신
        clearInterval(timerID);        // 기존 타이머 정지
        let newInterval=500-level*intervalStep; // 레벨이 오를수록 간격(ms)이 줄어들어 더 빨라짐
        timerID=setInterval(moveDown,newInterval); // 새 간격으로 타이머 재시작
        document.getElementById("levelDisplay").textContent=level; // 화면에 레벨 갱신 표시
    }
}

// 매치로 빈 칸이 생긴 후, 위 블록들을 아래로 떨어뜨리는(중력) 함수
function applyGravity(){
    for(let cIdx=0;cIdx<10;cIdx++){ 
        let stack=[]; 
        for(let r=0;r<10;r++){
            if(board[r][cIdx]!=""){
                stack.push(board[r][cIdx]); // 위에서부터 순서대로 색이 있는 칸들을 저장
            }
        }
        for(let r=9;r>=0;r--){ // 맨 아래 행(9)부터 위로 올라가며 채움
            if(stack.length>0){
                board[r][cIdx]=stack.pop(); // stack의 가장 아래 있던 블록부터 꺼내 아래쪽에 채움
            }
            else{
                board[r][cIdx]=""; // 채울 블록이 이제없으면 빈 칸으로
            }
            cell[r*10+cIdx].style.backgroundColor=board[r][cIdx]; // 화면 색도 board 값에 맞게 바꾸기
        }
    }
}

//키보드 방향조절함 
function keyDown(e){
    if(e.key=="ArrowLeft"){ // 왼쪽 화살표 키
        if(currentBlockCols>0 && board[currentBlockRow][currentBlockCols-1]==""){
            // 현재 열이 맨 왼쪽이 아니고, 왼쪽 칸이 비어있을 때만 이동하게끔
            cell[currentBlockRow*10+currentBlockCols].style.backgroundColor=""; // 현재 위치 색 지우기
            currentBlockCols--; // 왼쪽으로 한칸 이동
            cell[currentBlockRow*10+currentBlockCols].style.backgroundColor=currentColor; // 새 위치에 색칠
        }
    }
    else if(e.key=="ArrowRight"){ // 오른쪽 화살표 키
        if(currentBlockCols<9 && board[currentBlockRow][currentBlockCols+1]==""){
            // 현재 열이 맨 오른쪽이 아니고, 오른쪽 칸이 비어있을 때만 이동하게끔
            cell[currentBlockRow*10+currentBlockCols].style.backgroundColor="";
            currentBlockCols++; // 오른쪽으로 한칸 이동
            cell[currentBlockRow*10+currentBlockCols].style.backgroundColor=currentColor;
        }
    }
    else if(e.key==" "){ // 스페이스바 = 바로 떨어지기
        cell[currentBlockRow*10+currentBlockCols].style.backgroundColor=""; // 현재 위치 색 지우고
        while(currentBlockRow<9 && board[currentBlockRow+1][currentBlockCols]==""){
            currentBlockRow++; //계속 이동(블록 닿기전까지 쭉 이동)
        }
        cell[currentBlockRow*10+currentBlockCols].style.backgroundColor=currentColor; // 닿은곳위에 색 변경

        landPiece();
    }
}
</script>
</head>
<body onload="createTable()"> 
<div id="header">
    <h1>미니 테트리스</h1> 
    <div>점수: <span id="score">0</span></div>
</div>
<div id="nextArea">
    <div id="levelDisplay">0</div>
    <div id="nextBox"></div>        
</div>
<hr> <!-- 구분선 -->
<div id="tablearea"></div> 
</body>
</html>
